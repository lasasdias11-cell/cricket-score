<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#05070d" />
  <meta name="description" content="Thursday Cricket — a lightweight, real-time cricket match scoring app for your squad." />
  <title>Thursday Cricket · Live Scoring</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Floating animated background -->
  <div class="bg" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="bg-grid"></div>
  </div>

  <div id="app" class="app">

    <!-- ============ LOGIN ============ -->
    <section id="view-login" class="view is-active">
      <div class="glass card login-card">
        <div class="brand">
          <div class="logo">🏏</div>
          <h1>Thursday Cricket</h1>
          <p class="tagline">Live scoring for your squad</p>
        </div>
        <form id="login-form" autocomplete="off" novalidate>
          <label class="field">
            <span>Player ID (Name)</span>
            <select id="login-name" required></select>
          </label>
          <label class="field">
            <span>Team Secret Code</span>
            <input id="login-code" type="password" placeholder="••••••••" autocomplete="off" required />
          </label>
          <button type="submit" class="btn btn-primary btn-block">Enter Scoreboard</button>
        </form>
        <p id="login-sync" class="sync-status local">● Connecting…</p>
        <p class="hint">Default codes — White Tigers: <code>White@tiger</code> · Black Panthers: <code>Black@panthers</code></p>
      </div>
    </section>

    <!-- ============ MAIN APP ============ -->
    <section id="view-main" class="view">
      <header class="topbar glass">
        <div class="brand-mini">🏏 Thursday Cricket</div>
        <nav class="nav" id="main-nav">
          <button data-view="dashboard" class="nav-btn is-active">Home</button>
          <button data-view="match" class="nav-btn">Match</button>
          <button data-view="history" class="nav-btn">History</button>
          <button data-view="analysis" class="nav-btn">Analysis</button>
          <button data-view="team" class="nav-btn">Team</button>
        </nav>
        <div class="topbar-right">
          <span id="sync-status" class="sync-status local" title="Sync mode"></span>
          <span id="whoami" class="whoami"></span>
          <button id="logout-btn" class="btn btn-ghost btn-sm" type="button">Logout</button>
        </div>
      </header>

      <main class="content">

        <!-- Dashboard -->
        <div id="panel-dashboard" class="panel is-active">
          <h2 class="panel-title">Welcome back, <span id="dash-name" class="accent"></span> 👋</h2>
          <div class="grid grid-2">
            <div class="glass card" id="dash-team-card"></div>
            <div class="glass card" id="dash-live"></div>
          </div>
          <div class="glass card" id="dash-recent"></div>
        </div>

        <!-- Match setup + live scoring -->
        <div id="panel-match" class="panel">
          <h2 class="panel-title">Match Centre</h2>
          <div class="glass card" id="match-setup"></div>
          <div class="glass card" id="live-match"></div>
        </div>

        <!-- History -->
        <div id="panel-history" class="panel">
          <h2 class="panel-title">Match History</h2>
          <div id="history-list"></div>
        </div>

        <!-- Analysis -->
        <div id="panel-analysis" class="panel">
          <h2 class="panel-title">Analysis &amp; Awards</h2>
          <div class="field-inline">
            <label class="field">
              <span>Show</span>
              <select id="chart-select"></select>
            </label>
          </div>
          <div class="grid grid-2">
            <div class="glass card">
              <h3 class="card-title">Team Performance</h3>
              <div class="chart-wrap"><canvas id="pie-team"></canvas></div>
            </div>
            <div class="glass card">
              <h3 class="card-title">Player Run Distribution</h3>
              <div class="chart-wrap"><canvas id="pie-players"></canvas></div>
              <p id="player-chart-note" class="hint"></p>
            </div>
          </div>
          <div class="glass card" id="awards"></div>
        </div>

        <!-- Team / profile / secret-code vote -->
        <div id="panel-team" class="panel">
          <h2 class="panel-title">Team &amp; Profile</h2>
          <div class="grid grid-2">
            <div class="glass card" id="team-profile"></div>
            <div class="glass card" id="team-vote"></div>
          </div>
        </div>

      </main>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- CDN libraries (order matters) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
